---
- name: Update apt cache
  apt:
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- include_tasks: epel.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install WireGuard
  package:
    name: "{{ packages }}"
    state: latest
    update_cache: "{% if noobient_epel is defined and noobient_epel.changed %}true{% else %}false{% endif %}"
  vars:
    packages:
      - "iproute{% if ansible_facts['os_family'] == 'Debian' %}2{% endif %}"
      - wireguard-tools
      - qrencode
      - git
